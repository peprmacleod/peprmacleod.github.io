---
layout: default
---
<section class="page-head">
  <div class="wrap">
    {% if page.event %}<p class="eyebrow">{{ page.event }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="muted small">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
</section>

<section class="page-body">
  <div class="wrap prose">
    {{ content }}
    {% if page.link %}<p><a href="{{ page.link }}">Event page →</a></p>{% endif %}
    <p style="margin-top:2.5rem;"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
  </div>
</section>
