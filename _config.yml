# --- Site settings ---
title: "MacLeOD"
tagline: "Machine Learning on Geometries and Distributions"
description: >-
  MacLeOD is a PEPR IA research project unifying geometric and distributional
  deep learning through optimal transport on complex geometric spaces.
lang: en
# Set this to the final URL once known, e.g. https://macleod.pepr-ia.fr
