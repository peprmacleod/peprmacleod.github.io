# The five research axes of MacLeOD.
# Source: https://www.pepr-ia.fr/projet/macleod-2/
- id: 1
  title: "Optimal Transport on complex objects"
  summary: >-
    Model complex distributions with new optimal transport problems that go
    beyond classical settings on GMMs, times series and Neural Networks.
- id: 2
  title: "Distributional Deep Learning for Graphs"
  summary: >-
    Develop deep learning methods that operate on graphs modeled as
    distributions for representation learning, graph generation under
    constraints and dynamic graph modelling.
  
- id: 3
  title: "Deep learning of distributions on manifolds"
  summary: >-
    Design deep learning architectures that encode distributions supported on
    manifolds.
- id: 4
  title: "Scaling Optimal Transport with slicing and random projections"
  summary: >-
    Develop scalable optimal transport methods based on slicing and random projections to
    handle high-dimensional distributions.

